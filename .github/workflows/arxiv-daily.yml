name: Update arXiv Daily

"on":
  workflow_dispatch: {}
  schedule:
    # 08:00 and 20:00 Asia/Shanghai. The 14-day lookback catches delayed indexing.
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: arxiv-daily-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: arXiv_daily/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r arXiv_daily/requirements.txt

      - name: Fetch and rebuild archive
        run: python arXiv_daily/scripts/fetch_arxiv.py

      - name: Validate generated archive
        run: |
          python -m unittest discover -s arXiv_daily/tests -p "test_*.py"
          python arXiv_daily/scripts/validate_archive.py

      - name: Commit archive update directly to main
        run: |
          if git diff --quiet -- arXiv_daily; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arXiv_daily
          git commit -m "chore(arxiv-daily): update paper archive"
          git pull --rebase origin main
          git push origin HEAD:main
